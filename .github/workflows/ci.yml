name: CI

on:
  push:
    branches: [main, develop, "release/**", "support/**"]
  pull_request:
    branches: [main, develop, "release/**", "support/**"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality gates
    permissions:
      contents: read
    uses: t33n-software/repository-governance/.github/workflows/reusable-ci-go.yml@cc7e8a4068404d61ec609ca1eb8ba28a56ad974d
    with:
      quality_class: linux-only
