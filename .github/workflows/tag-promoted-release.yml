name: Tag Promoted Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

concurrency:
  group: release-tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    name: Release tag
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.merge_commit_sha != ''
    permissions:
      actions: write
      contents: write
    uses: t33n-software/git-governance/.github/workflows/reusable-tag-promoted-release.yml@3b0d034fc773b38dd13e3b13b24d1cbd7c2b0368
    with:
      release_branch: ${{ github.event.pull_request.head.ref }}
      merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
      delivery_environment: release-delivery
