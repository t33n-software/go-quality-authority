name: Governed Release Reconciliation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Align a delivered release or publish a validated reconciliation resolution.
        required: true
        type: choice
        options:
          - reconciliation-align
          - reconciliation-resume
      release:
        description: Delivered release/<semver> line.
        required: true
        type: string
      ticket_key:
        description: Ticket key for the reconciliation preparation.
        required: true
        type: string
      ticket:
        description: Ticket number for the reconciliation preparation.
        required: true
        type: string
      slug:
        description: Kebab-case reconciliation preparation description.
        required: true
        type: string
      resolution_branch:
        description: Ticket-bound resolved reconciliation branch; required for reconciliation-resume.
        required: false
        type: string

permissions: {}

concurrency:
  group: release-reconciliation-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Release reconciliation
    permissions:
      contents: write
      id-token: write
    uses: t33n-software/git-governance/.github/workflows/reusable-release-reconciliation.yml@77da3857d8db3f3567522651750980e087c0a6eb
    with:
      operation: ${{ inputs.operation }}
      release: ${{ inputs.release }}
      ticket_key: ${{ inputs.ticket_key }}
      ticket: ${{ inputs.ticket }}
      slug: ${{ inputs.slug }}
      resolution_branch: ${{ inputs.resolution_branch }}
      delivery_variant: ${{ vars.GIT_GOVERNANCE_DELIVERY_VARIANT }}
      reconciliation_environment: release-reconciliation
      governance_repository: t33n-software/git-governance
